
name: Bouw Mijn Ploegendienst RELEASE

on:
  workflow_dispatch:
  push:
    paths:
      - 'MijnPloegendienstAndroid_v3.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Project ophalen
        uses: actions/checkout@v4

      - name: Java 17 instellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK instellen
        uses: android-actions/setup-android@v3

      - name: Android onderdelen installeren
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Project uitpakken
        run: |
          unzip -q MijnPloegendienstAndroid_v3.zip -d project

      - name: Gradle instellen
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Release APK bouwen
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f -printf '%h\n' | head -1)
          echo "Project gevonden: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon

      - name: APK ondertekenen
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f -printf '%h\n' | head -1)

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/mijnploegendienst.jks" \
            -storepass "MijnPloegendienst2026!" \
            -keypass "MijnPloegendienst2026!" \
            -alias mijnploegendienst \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Mijn Ploegendienst, O=Mijn Ploegendienst, C=NL"

          UNSIGNED=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name "*-unsigned.apk" | head -1)

          $ANDROID_HOME/build-tools/35.0.0/zipalign \
            -p -f 4 \
            "$UNSIGNED" \
            "$RUNNER_TEMP/aligned.apk"

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks "$RUNNER_TEMP/mijnploegendienst.jks" \
            --ks-pass pass:MijnPloegendienst2026! \
            --key-pass pass:MijnPloegendienst2026! \
            --out "$RUNNER_TEMP/MijnPloegendienst-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

      - name: Release APK controleren
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose \
            "$RUNNER_TEMP/MijnPloegendienst-release.apk"

      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: MijnPloegendienst-RELEASE-APK
          path: ${{ runner.temp }}/MijnPloegendienst-release.apk
