name: Bouw Mijn Ploegendienst APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MijnPloegendienstAndroid.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Java 17 instellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK instellen
        uses: android-actions/setup-android@v3

      - name: Android SDK onderdelen installeren
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Project uitpakken
        run: |
          unzip -q MijnPloegendienstAndroid.zip -d project
          echo "Bestanden:"
          find project -maxdepth 3 -type f | head -100


