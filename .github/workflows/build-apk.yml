name: Bouw Mijn Ploegendienst APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MijnPloegendienstAndroid.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Java 17 instellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK instellen
        uses: android-actions/setup-android@v3

      - name: Android SDK onderdelen installeren
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Project uitpakken
        run: |
          unzip -q MijnPloegendienstAndroid.zip -d project
          echo "Bestanden:"
          find project -maxdepth 3 -type f | head -100

      - name: Gradle instellen
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bouwen
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f -printf '%h\n' | head -1)
          echo "Project gevonden in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: MijnPloegendienst-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
